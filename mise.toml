[tools]
aube = "2.8.2"
node = "26.11.1"
pipx = "1.17.14"
# --include-deps: the `mkdocs` binary belongs to a dependency, not to
# mkdocs-material itself, and pipx will not expose it otherwise. uvx = false
# because mise prefers uvx wherever `uv` is installed, and there
# --include-deps is neither accepted nor equivalent.
"pipx:mkdocs-material" = { version = "9.7.7", uvx = false, pipx_args = "--include-deps" }
python = "3.14"
"pipx:vekna" = { version = "0.13.0", pipx_args = "--preinstall git+https://github.com/fancysnake/cabinet.git@v3.0.0" }

[hooks]
enter = "aube install && aube exec astro sync"

[tasks.dev]
description = "Start the Astro dev server"
run = "aube run dev"

[tasks.build]
description = "Build the static site"
run = "aube run build"

[tasks."build:demo"]
description = "Build the static site under /demo, as Pages publishes it"
env = { CANTARE_BASE = "/demo" }
run = "aube run build"

[tasks.preview]
description = "Preview the built site"
run = "aube run preview"

[tasks.lint]
description = "ESLint + Prettier check"
depends = ["sync"]
run = ["aube run lint", "aube run format:check"]

[tasks.format]
description = "Format with Prettier"
run = "aube run format"

[tasks.check]
description = "Type-check templates with astro check"
run = "aube run check"

[tasks."song:check"]
description = "Assert the word-grouping rules in src/lib/song.ts and songbook matching"
run = ["node src/lib/song.check.ts", "node src/lib/songbook.check.ts"]

[tasks."site:serve"]
description = "Serve the docs at http://localhost:8000"
run = "mkdocs serve"

[tasks."site:check"]
description = "Build the docs, failing on a broken link"
run = "mkdocs build --strict --site-dir ${SITE_DIR:-site}"

[tasks.fullcheck]
description = "The gate before a commit: deps, lint, types, song rules, sub-path build, docs"
run = [
    "aube install --frozen-lockfile",
    { task = "lint" },
    { task = "check" },
    { task = "song:check" },
    { task = "build:demo" },
    { task = "site:check" },
]

[tasks.sync]
description = "Generate Astro types (astro sync)"
run = "aube exec astro sync"

[env]
_.path = ['{{config_root}}/node_modules/.bin']

[tasks.update]
run = [
    "mise upgrade --bump --exclude python --minimum-release-age=7d",
    "aube update",
    "aube outdated"
]

[tasks.lock]
run = "aube install --lockfile-only --no-frozen-lockfile"
