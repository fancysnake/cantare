name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - name: Install dependencies
        run: aube install

      - name: Generate Astro types
        run: mise run sync

      - name: ESLint + Prettier check
        run: mise run lint

      - name: Type-check with astro check
        run: mise run check

      # The base-path build is what Pages publishes; nothing else exercises it.
      - name: Build under a sub-path
        run: mise run build
        env:
          CANTARE_BASE: /demo

      - name: Build the docs
        run: mise run site:check
