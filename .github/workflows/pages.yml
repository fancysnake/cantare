name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: aube install

      - name: Generate Astro types
        run: mise run sync

      - name: Build the demo songbook
        run: mise run build
        env:
          CANTARE_BASE: /demo

      - uses: actions/configure-pages@v6

      - name: Build the docs
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      # After Jekyll, so its `_astro/` directory is never treated as a Jekyll
      # special dir; deploy-pages ships the artifact as-is.
      - name: Add the demo at /demo/
        run: mv dist _site/demo

      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
